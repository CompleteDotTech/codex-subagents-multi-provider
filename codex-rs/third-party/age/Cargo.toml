[package]
name = "age"
description = "[BETA] A simple, secure, and modern encryption library."
version = "0.12.1"
authors = ["Jack Grigg <thestr4d@gmail.com>"]
repository = "https://github.com/str4d/rage"
readme = "README.md"
keywords = ["rage", "encryption"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"

[badges]
maintenance = { status = "experimental" }

[dependencies]
age-core = { "version" = "0.12.0", "git" = "https://github.com/str4d/rage", "rev" = "b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f" }

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
base64 = { "version" = "0.22" }
chacha20poly1305 = { "version" = "0.11", "default-features" = false, "features" = ["alloc"] }
hmac = { "version" = "0.13" }
i18n-embed = { "version" = "0.16", "features" = ["fluent-system"] }
rand = { "version" = "0.10" }

# OpenSSH-specific dependencies:
# - RSAES-OAEP from RFC 8017 with SHA-256 and MGF1
rsa = { version = "=0.10.0-rc.18", default-features = false, features = [
    "encoding",
], optional = true }

# - Conversion of public keys from Ed25519 to X25519
curve25519-dalek = { version = "5", optional = true }

# Async I/O
futures = { version = "0.3", optional = true }
pin-project = "1"

# Common CLI dependencies
pinentry = { "version" = "0.8", "optional" = true }

# Dependencies used internally:
# (Breaking upgrades to these are usually backwards-compatible, but check MSRVs.)
bech32 = { "version" = "0.11" }
cipher = { version = "0.5", features = ["alloc"] }
cookie-factory = { "version" = "0.3.1" }
hkdf = { "version" = "0.13" }
hpke = { "version" = "0.14", "default-features" = false, "features" = ["alloc", "chacha", "mlkem", "nistp"] }
i18n-embed-fl = { "version" = "0.10" }
lazy_static = { "version" = "1" }
ml-kem = { "version" = "0.3" }
nom = { "version" = "8", "default-features" = false, "features" = ["alloc"] }
p256 = { "version" = "0.14", "default-features" = false, "features" = ["arithmetic"] }
rust-embed = { "version" = "8" }
scrypt = { "version" = "0.12", "default-features" = false }
sha2 = { "version" = "0.11" }
sha3 = { "version" = "0.12" }
subtle = { "version" = "2.6" }
x25519-dalek = { "version" = "3", "features" = ["static_secrets"] }
zeroize = { "version" = "1" }

# OpenSSH-specific dependencies:
# - RSAES-OAEP from RFC 8017 with SHA-256 and MGF1
num-traits = { version = "0.2", optional = true }

# - Encrypted keys
aes = { version = "0.9", optional = true }
aes-gcm = { version = "0.11", optional = true }
bcrypt-pbkdf = { version = "0.11", optional = true }
cbc = { version = "0.2", optional = true }
ctr = { version = "0.10", optional = true }

# scrypt Performance timer
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Performance",
] }

# Async I/O
memchr = { version = "2.5", optional = true }

# Common CLI dependencies
console = { "version" = "0.16", "default-features" = false, "optional" = true, "features" = ["std"] }
is-terminal = { version = "0.4", optional = true }
rpassword = { version = "7", optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
# Plugin management
which = { version = "8", optional = true }
wsl = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.5"
flate2 = { "version" = "1" }
futures-test = "0.3"
hex = "0.4"
i18n-embed = { "version" = "0.16", "features" = ["fluent-system", "desktop-requester"] }
proptest = "1"
test-case = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dev-dependencies]
criterion-cycles-per-byte = "0.6"

[features]
default = []
armor = []
async = ["futures", "memchr"]
cli-common = ["console", "is-terminal", "pinentry", "rpassword"]
plugin = ["age-core/plugin", "which", "wsl"]
ssh = [
    "aes",
    "aes-gcm",
    "bcrypt-pbkdf",
    "cbc",
    "ctr",
    "curve25519-dalek",
    "num-traits",
    "rsa",
]
unstable = ["age-core/unstable"]

[lib]
bench = false

[[test]]
name = "test_vectors"
required-features = ["ssh"]

[[test]]
name = "testkit"
required-features = ["armor", "async"]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "throughput"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
rust = { "unexpected_cfgs" = { "level" = "warn", "check-cfg" = ["cfg(fuzzing)"] } }

# Keep upstream dev/test feature resolution outside the application workspace.
[workspace]

