name: setup-bazel-ci
description: Prepare a Bazel CI runner with shared caches.
inputs:
  target:
    description: Target triple used for cache namespacing.
    required: true
  native-windows-voice:
    description: Provision pinned job-local tools for this fork's native Windows fallback.
    required: false
    default: "false"
  windows-resource-observation:
    description: Observe bounded hosted Windows diagnostic resources.
    required: false
    default: "false"
outputs:
  repository-cache-path:
    description: Filesystem path used for the Bazel repository cache.
    value: ${{ steps.configure_bazel_repository_cache.outputs.repository-cache-path }}

runs:
  using: composite
  steps:
    - id: setup_ci
      uses: ./.github/actions/setup-ci

    - name: Observe resources after build path provisioning
      if: inputs.windows-resource-observation == 'true' && runner.os == 'Windows' && runner.environment == 'github-hosted' && github.repository == 'CompleteDotTech/codex-subagents-multi-provider'
      continue-on-error: true
      shell: pwsh
      run: python .github/scripts/observe_windows_ci_resources.py after-provision

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      # Without an explicit Bazelisk version, setup-bazel leaves PATH unchanged
      # and Windows can use the runner's standalone Bazel, ignoring .bazelversion.
      with:
        bazelisk-version: 1.28.1
        # setup-bazel writes an explicit output_base, which otherwise overrides
        # BAZEL_OUTPUT_USER_ROOT and leaves Bazel's I/O-heavy trees on C:.
        output-base: ${{ steps.setup_ci.outputs.bazel-output-base }}

    - name: Configure Bazel repository cache
      id: configure_bazel_repository_cache
      shell: bash
      run: |
        echo "repository-cache-path=$BAZEL_REPOSITORY_CACHE" >> "$GITHUB_OUTPUT"

    - name: Expose MSVC SDK environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Bazel exec-side Rust build scripts do not reliably inherit the MSVC developer
        # shell on GitHub-hosted Windows runners, so discover the latest VS install and
        # ask `VsDevCmd.bat` to materialize the x64/x64 compiler + SDK environment.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere.exe not found"
        }

        $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
        if (-not $installPath) {
          throw "Could not locate a Visual Studio installation with VC tools"
        }

        $vsDevCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
        if (-not (Test-Path $vsDevCmd)) {
          throw "VsDevCmd.bat not found at $vsDevCmd"
        }

        # Keep the export surface explicit: these are the paths and SDK roots that the
        # MSVC toolchain probes need later when Bazel runs Windows exec-platform build
        # scripts such as `aws-lc-sys`.
        $varsToExport = @(
          'INCLUDE',
          'LIB',
          'LIBPATH',
          'PATH',
          'UCRTVersion',
          'UniversalCRTSdkDir',
          'VCINSTALLDIR',
          'VCToolsInstallDir',
          'WindowsLibPath',
          'WindowsSdkBinPath',
          'WindowsSdkDir',
          'WindowsSDKLibVersion',
          'WindowsSDKVersion'
        )

        # `VsDevCmd.bat` is a batch file, so invoke it under `cmd.exe`, suppress its
        # banner, then dump the resulting environment with `set`. Re-export only the
        # approved keys into `GITHUB_ENV` so later steps inherit the same MSVC context.
        $envLines = & cmd.exe /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $vsDevCmd)
        foreach ($line in $envLines) {
          if ($line -notmatch '^(.*?)=(.*)$') {
            continue
          }

          $name = $matches[1]
          $value = $matches[2]
          if ($varsToExport -contains $name) {
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }

    - name: Compute cache-stable Windows Bazel PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/compute-bazel-windows-path.ps1

    - name: Provision pinned native Windows voice build inputs
      if: inputs.native-windows-voice == 'true' && runner.os == 'Windows' && github.repository == 'CompleteDotTech/codex-subagents-multi-provider'
      shell: pwsh
      env:
        REQUESTED_TARGET: ${{ inputs.target }}
      run: |
        $ErrorActionPreference = "Stop"
        if ($env:REQUESTED_TARGET -ne "x86_64-pc-windows-gnullvm") {
          throw "Native Windows fallback provisioning requires the x64 Windows CI target"
        }
        if (-not $env:SystemRoot -or -not (Test-Path -LiteralPath $env:SystemRoot -PathType Container)) {
          throw "The actual Windows SystemRoot directory is required"
        }
        $hostArch = $env:PROCESSOR_ARCHITEW6432
        if (-not $hostArch) { $hostArch = $env:PROCESSOR_ARCHITECTURE }
        if ($hostArch -ne "AMD64") { throw "The native x64 fallback requires an actual AMD64 Windows host" }
        $manifest = Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json
        $directory = Join-Path $env:RUNNER_TEMP "voice-cygwin-snapshot"
        New-Item -ItemType Directory -Path $directory | Out-Null
        # Public source assets live upstream; this fork does not mirror the release.
        foreach ($pin in @($manifest.archive, $manifest.sourceArchive)) {
          $destination = Join-Path $directory $pin.name
          $url = "https://github.com/openai/codex/releases/download/$($manifest.archive.tag)/$($pin.name)"
          Invoke-WebRequest -Uri $url -OutFile $destination
          if ((Get-Item -LiteralPath $destination).Length -ne $pin.bytes -or
              (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {
            throw "Pinned public Cygwin input size or digest mismatch: $($pin.name)"
          }
        }
        # Reuse the signed offline snapshot/inventory and native pkgconf checks.
        & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive (Join-Path $directory $manifest.archive.name)
        "VOICE_WINDOWS_SYSTEM_ROOT=$env:SystemRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VOICE_WINDOWS_HOST_ARCH=$hostArch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
